<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="IE 22375" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <title>IE 22375 · Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height: 100vh; margin: 0;
      background: radial-gradient(ellipse at top, #e0f2fe 0%, transparent 55%), radial-gradient(ellipse at bottom right, #d1fae5 0%, transparent 45%), #f1f5f9; }
    .card { background:#fff; border-radius:20px; box-shadow:0 12px 40px rgba(15,23,42,.1); }
    .btn { border-radius:14px; font-weight:800; padding:.75rem 1.1rem; border:0; cursor:pointer; width:100%; font-size:15px; }
    .btn-primary { background:#0284c7; color:#fff; }
    .btn-ghost { background:#e2e8f0; color:#0f172a; }
    input, select { width:100%; border:1.5px solid #cbd5e1; border-radius:12px; padding:.75rem .9rem; font-size:16px; min-height:48px; background:#fff; }
    .hidden { display: none !important; }
    #viewHub { position: relative; z-index: 2; }
    #viewLogin { position: relative; z-index: 1; }
    .mod-card {
      display: block; text-decoration: none; color: inherit;
      border-radius: 16px; padding: 1.1rem 1.15rem; background: #fff;
      border: 1.5px solid #e2e8f0; min-height: 72px;
      -webkit-tap-highlight-color: rgba(2,132,199,.18);
      touch-action: manipulation; cursor: pointer;
    }
    .mod-card:active { background: #e0f2fe; }
    .hub-header { padding-top: calc(12px + env(safe-area-inset-top, 28px)); }
    .hub-header .btn { width: auto; min-height: 44px; min-width: 72px; touch-action: manipulation; }
  </style>
</head>
<body class="text-slate-800">
  <div id="viewLogin" class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <img src="icon-192.png" alt="Insignia IE 22375" class="w-28 h-28 mx-auto object-contain drop-shadow-sm" onerror="this.onerror=null;this.src='apple-touch-icon.png'" />
        <div class="text-[11px] font-bold tracking-widest text-sky-700 mt-3">INSTITUCIÓN EDUCATIVA 22375</div>
        <h1 class="text-xl font-black mt-1">Santa Rosa de los Molinos</h1>
        <p class="text-sm text-slate-500 mt-1">Ingreso al sistema · 2026</p>
      </div>
      <form class="card p-5 space-y-3" id="formLogin" autocomplete="on" onsubmit="intentarLogin(); return false;">
        <div>
          <label class="text-[10px] font-bold text-slate-500">Tipo de acceso</label>
          <select id="inpTipo" name="rol" onchange="onTipoChange()" autocomplete="off">
            <option value="docente">Docente</option>
            <option value="admin">Administrador</option>
            <option value="auxiliar">Auxiliar</option>
            <option value="pip">Innovación</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500">Usuario</label>
          <input type="text" id="inpDocUser" name="username" placeholder="usuario" autocomplete="username" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500">Contraseña</label>
          <input type="password" id="inpPass" name="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-600 font-semibold cursor-pointer">
          <input type="checkbox" id="inpRecordar" class="w-4 h-4" checked />
          Recordar sesión en este equipo
        </label>
        <p id="loginErr" class="hidden text-sm text-red-600 font-semibold bg-red-50 rounded-lg px-3 py-2"></p>
        <button type="submit" class="btn btn-primary">Ingresar</button>
        <p class="text-[11px] text-slate-400 text-center">El navegador puede ofrecer guardar la contraseña al ingresar.</p>
      </form>
      <p class="text-[10px] text-center text-slate-400 mt-8">Desarrollo · Diseño e integración Mag. Efrain Ceopa Paredes</p>
    </div>
  </div>
  <div id="viewHub" class="hidden min-h-screen">
    <header class="hub-header bg-gradient-to-r from-slate-900 to-sky-900 text-white">
      <div class="max-w-lg mx-auto px-4 pb-4 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="text-[10px] font-bold tracking-widest text-sky-200">IE 22375</div>
          <div class="font-black truncate" id="hubTitulo">Panel</div>
          <div class="text-xs text-sky-100/80 truncate" id="hubSub">—</div>
        </div>
        <button type="button" class="btn btn-ghost text-xs" style="width:auto;padding:0.5rem 0.75rem" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>
    <main class="max-w-lg mx-auto px-4 py-5 space-y-3">
      <p class="text-sm text-slate-500">Seleccione el módulo:</p>
      <div id="modulos" class="grid gap-3"></div>
    </main>
  </div>
<script>
const ADMIN_PASS = 'admin22375';
const SESSION_KEY = 'ie22375_session_v1';
const DOCENTES_KEY = 'ie22375_docentes_v1';
const CLOUD_API_URL = 'https://script.google.com/macros/s/AKfycbxI0pfjZfeecboqvwx4YOjcvyGTGVa1smmyyE9kNQCmNgNL3tDXwFlPUL0i1DJ2DwBNIg/exec';
function loadDocentesLocal() {
  try { const raw = localStorage.getItem(DOCENTES_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return [];
}
function loadDocentes() {
  return loadDocentesLocal();
}
async function fetchConTiempo(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    return r;
  } finally { clearTimeout(t); }
}
async function asegurarDocentesRemotos() {
  try {
    const r = await fetchConTiempo(CLOUD_API_URL + '?action=loaddoc&t=' + Date.now(), 2800);
    if (r && r.ok) {
      const data = await r.json();
      const list = (data && data.ok && Array.isArray(data.docentes)) ? data.docentes : [];
      if (list.length) {
        localStorage.setItem(DOCENTES_KEY, JSON.stringify(list));
        return true;
      }
    }
  } catch (e) {}
  if (loadDocentesLocal().length) return true;
  try {
    const r = await fetchConTiempo('docentes.json?t=' + Date.now(), 2000);
    if (!r || !r.ok) return false;
    const data = await r.json();
    const list = Array.isArray(data) ? data : (data.docentes || []);
    if (list.length) localStorage.setItem(DOCENTES_KEY, JSON.stringify(list));
    return list.length > 0;
  } catch(e) {}
  return false;
}
const SESSION_MS = 7 * 24 * 60 * 60 * 1000;
function leerSesionCruda() {
  try {
    const a = sessionStorage.getItem(SESSION_KEY);
    if (a) return JSON.parse(a);
  } catch (e) {}
  try {
    const b = localStorage.getItem(SESSION_KEY);
    if (b) return JSON.parse(b);
  } catch (e) {}
  return null;
}
function getSession() {
  const s = leerSesionCruda();
  if (!s || !s.ts) return null;
  if (Date.now() - s.ts > SESSION_MS) { clearSession(); return null; }
  return s;
}
function setSession(obj) {
  const data = JSON.stringify(obj);
  sessionStorage.setItem(SESSION_KEY, data);
  if (obj.recordar) localStorage.setItem(SESSION_KEY, data);
  else localStorage.removeItem(SESSION_KEY);
}
function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
}
function onTipoChange() {
  const t = document.getElementById('inpTipo').value;
  const u = document.getElementById('inpDocUser');
  if (!u) return;
  if (t === 'admin' && !u.value) u.value = 'admin';
  if (t === 'auxiliar' && !u.value) u.value = 'auxiliar';
  if (t === 'pip' && !u.value) u.value = 'pip';
  if (t === 'docente' && (u.value === 'admin' || u.value === 'auxiliar' || u.value === 'pip')) u.value = '';
}
async function intentarLogin() {
  const err = document.getElementById('loginErr');
  err.classList.add('hidden');
  const tipo = document.getElementById('inpTipo').value;
  const pass = (document.getElementById('inpPass').value || '').trim();
  if (!pass) {
    err.textContent = 'Escriba su contraseña.';
    err.classList.remove('hidden');
    return;
  }
  if (tipo === 'admin') {
    const custom = localStorage.getItem('ie22375_admin_pass');
    if (pass !== (custom || ADMIN_PASS)) {
      err.textContent = 'La contraseña no es correcta.';
      err.classList.remove('hidden');
      return;
    }
    setSession({ user:'admin', label:'Administrador', nivel:'admin', role:'admin', grados:null, areas:null,
      mods:['admin_bd','registro','auxiliar','wa_grupos','matriz_pri','matriz_sec','aip'], ts:Date.now(),
      recordar: !!(document.getElementById('inpRecordar')||{}).checked });
    mostrarHub();
    return;
  }
  if (tipo === 'auxiliar') {
    if (pass !== 'aux22375') {
      err.textContent = 'La contraseña no es correcta.';
      err.classList.remove('hidden');
      return;
    }
    setSession({ user:'auxiliar', label:'Auxiliar', nivel:'colegio', role:'auxiliar',
      grados:null, areas:null, mods:['auxiliar','wa_grupos'], ts:Date.now(),
      recordar: !!(document.getElementById('inpRecordar')||{}).checked });
    mostrarHub();
    return;
  }
  if (tipo === 'pip') {
    if (pass !== 'pip22375') {
      err.textContent = 'La contraseña no es correcta.';
      err.classList.remove('hidden');
      return;
    }
    setSession({ user:'pip', label:'Innovación', nivel:'colegio', role:'pip',
      grados:null, areas:null, mods:['aip'], ts:Date.now(),
      recordar: !!(document.getElementById('inpRecordar')||{}).checked });
    mostrarHub();
    return;
  }
  const docUser = document.getElementById('inpDocUser').value.trim().toLowerCase();
  if (!docUser) { err.textContent = 'Ingrese su usuario de docente.'; err.classList.remove('hidden'); return; }
  let d = loadDocentes().find(x => String(x.user||'').toLowerCase() === docUser && x.pass === pass);
  if (!d) {
    err.textContent = 'Comprobando usuarios…';
    err.classList.remove('hidden');
    await asegurarDocentesRemotos();
    d = loadDocentes().find(x => String(x.user||'').toLowerCase() === docUser && x.pass === pass);
  } else {
    asegurarDocentesRemotos();
  }
  if (!d) {
    err.textContent = 'La contraseña no es correcta.';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  setSession({
    user: d.user, label: d.nombre || d.user, nivel: d.nivel, role: 'docente',
    grados: d.nivel === 'primaria' ? (d.grados || []) : null,
    areas: d.nivel === 'secundaria' ? (d.areas || []) : null,
    aulas: d.nivel === 'secundaria' ? (d.aulas || []) : null,
    mods: d.nivel === 'primaria' ? ['matriz_pri','registro'] : ['matriz_sec','registro'],
    ts: Date.now(),
    recordar: !!(document.getElementById('inpRecordar')||{}).checked
  });
  mostrarHub();
}
function cerrarSesion() {
  clearSession();
  document.getElementById('viewHub').classList.add('hidden');
  document.getElementById('viewLogin').classList.remove('hidden');
  document.getElementById('inpPass').value = '';
}
function modsDe(s) {
  if (s.role === 'admin' || s.user === 'admin') return ['admin_bd','registro','auxiliar','wa_grupos','matriz_pri','matriz_sec','aip'];
  if (s.role === 'auxiliar' || s.user === 'auxiliar') return ['auxiliar','wa_grupos'];
  if (s.role === 'pip' || s.user === 'pip') return ['aip'];
  if (s.nivel === 'primaria') return ['matriz_pri','registro'];
  if (s.nivel === 'secundaria') return ['matriz_sec','registro'];
  return ['registro'];
}
function irModulo(href) {
  window.location.href = href;
}
function mostrarHub() {
  const s = getSession();
  if (!s) { document.getElementById('viewLogin').classList.remove('hidden'); document.getElementById('viewHub').classList.add('hidden'); return; }
  document.getElementById('viewLogin').classList.add('hidden');
  document.getElementById('viewHub').classList.remove('hidden');
  document.getElementById('hubTitulo').textContent = s.label;
  let sub = s.role === 'admin' ? 'Acceso total' : (s.nivel || '');
  if (s.role === 'docente') {
    if (s.grados && s.grados.length) sub += ' · Grado ' + s.grados.map(g => g + '°').join(', ');
    if (s.areas && s.areas.length) sub += ' · ' + s.areas.join(', ');
    if (s.aulas && s.aulas.length) sub += ' · ' + s.aulas.map(a => a.replace('|','° ')).join(', ');
  }
  document.getElementById('hubSub').textContent = sub;
  const catalog = {
    matriz_pri: { href:'primaria.html', title:'Matriz consolidado · Primaria', desc:'Áreas y gráficos de avance', badge:'PRIMARIA' },
    matriz_sec: { href:'secundaria.html', title:'Matriz consolidado · Secundaria', desc:'Áreas y gráficos de avance', badge:'SECUNDARIA' },
    registro: { href:'registro.html', title:'Registro auxiliar', desc:'Notas, asistencia e impresión', badge:'REGISTRO' },
    admin_bd: { href:'admin.html', title:'Administración', desc:'BD, docentes y bimestres', badge:'ADMIN' },
    auxiliar: { href:'auxiliar.html', title:'Asistencia de ingreso', desc:'Puerta · QR · lista del aula', badge:'AUXILIAR' },
    wa_grupos: { href:'auxiliar.html#grupos', title:'Grupos del día', desc:'Enviar listas de asistencia a WhatsApp', badge:'WHATSAPP' },
    aip: { href:'aula_innovacion.html', title:'Aula de innovación (AIP)', desc:'Horario mensual · competencia 28', badge:'Innovación' }
  };
  const keys = modsDe(s).filter(m => catalog[m]);
  document.getElementById('modulos').innerHTML = keys.map(key => {
    const m = catalog[key];
    return '<a class="mod-card" href="'+m.href+'" onclick="irModulo(\''+m.href+'\');return false;">' +
      '<div class="text-[10px] font-bold tracking-widest text-slate-400">'+m.badge+'</div>' +
      '<div class="font-black text-base mt-0.5">'+m.title+'</div>' +
      '<div class="text-sm text-slate-500 mt-0.5">'+m.desc+'</div></a>';
  }).join('') || '<p class="text-sm text-slate-500">No hay módulos para este usuario.</p>';
}
onTipoChange();
if (getSession()) mostrarHub();
asegurarDocentesRemotos();
</script>
</body>
</html>
